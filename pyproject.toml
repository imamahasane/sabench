[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sabench"
version = "0.1.0"
description = "Search-aware evaluation of acoustic and embedding features on the ADReSS/ADReSSo dementia-detection benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Md Imam Ahasan", email = "emamahasane@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "matplotlib>=3.7",
    "soundfile>=0.12",
    "tenacity>=8.2",
    "rich>=13.7",
]

[project.optional-dependencies]
audio = [
    "opensmile>=2.5",
    "librosa>=0.10",
    "pyannote.audio>=4.0",
]
embeddings = [
    "torch>=2.1",
    "transformers>=4.38",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
sabench = "sabench.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sabench = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
